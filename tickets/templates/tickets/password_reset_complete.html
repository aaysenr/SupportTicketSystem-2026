{% extends 'base.html' %}

{% block title %}Şifre Güncellendi - Destek Sistemi{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 mt-4 rounded-4">
            <div class="card-body p-4 p-md-5 text-center">
                <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-3">
                    <i class="bi bi-patch-check-fill fs-2"></i>
                </div>
                <h3 class="fw-bold mb-3">Şifreniz Başarıyla Sıfırlandı!</h3>
                <p class="text-muted mb-4">
                    Yeni şifreniz başarıyla kaydedildi. Artık yeni şifrenizi kullanarak sisteme güvenle giriş yapabilirsiniz.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-bold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Hemen Giriş Yap
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
