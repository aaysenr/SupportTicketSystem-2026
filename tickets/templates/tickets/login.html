{% extends 'base.html' %}

{% block title %}Giriş Yap - Destek Sistemi{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock display-4 text-primary"></i>
                    <h3 class="fw-bold mt-2">Sisteme Giriş</h3>
                    <p class="text-muted small">Kullanıcı adı ve şifrenizle oturum açın</p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-bold small text-muted">Kullanıcı Adı</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" id="id_username" class="form-control" required autofocus placeholder="Kullanıcı adınızı girin">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-bold small text-muted">Şifre</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" id="id_password" class="form-control" required placeholder="Şifrenizi girin">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Giriş Yap
                    </button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="mb-0 text-muted small">Hesabınız yok mu?</p>
                    <a href="{% url 'register' %}" class="fw-bold text-decoration-none">Hemen Kaydolun</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
