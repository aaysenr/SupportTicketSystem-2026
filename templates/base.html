<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Destek Talep Sistemi{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <!-- Üst Menü (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-headset me-2"></i>Destek Sistemi
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Tüm Talepler</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    {% if user.is_authenticated %}
                    <span class="navbar-text text-white me-3">
                        <i class="bi bi-person-circle me-1"></i>{{ user.username }}
                    </span>
                    <a href="/admin/logout/" class="btn btn-outline-light btn-sm">Çıkış Yap</a>
                    {% else %}
                    <a href="/admin/login/" class="btn btn-light btn-sm">Giriş Yap</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Ana İçerik Alanı (Diğer sayfalar burayı dolduracak) -->
    <div class="container">
        {% block content %}
        <!-- Diğer HTML sayfalarının içeriği buraya gelecek -->
        {% endblock %}
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
