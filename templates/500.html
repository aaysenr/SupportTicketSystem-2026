<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunucu Hatası (500) - Destek Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script>
        // Kullanıcının kayıtlı tema tercihini yükle
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>
</head>
<body class="bg-body-tertiary d-flex align-items-center min-vh-100">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                <div class="card border-0 shadow rounded-4 p-4 p-md-5 bg-body">
                    <div class="mb-4">
                        <span class="display-1 fw-bold text-danger opacity-75">500</span>
                        <div class="mt-2 text-warning fs-1">
                            <i class="bi bi-exclamation-octagon-fill"></i>
                        </div>
                    </div>

                    <h3 class="fw-bold mb-2 text-body">Beklenmeyen Bir Hata Oluştu</h3>
                    <p class="text-body-secondary mb-4">
                        Sunucumuz isteğinizi işlerken geçici bir problemle karşılaştı. Teknik ekibimiz durumdan haberdar edildi. Lütfen birkaç dakika sonra tekrar deneyiniz.
                    </p>

                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a href="/" class="btn btn-primary px-4 py-2 rounded-pill fw-semibold">
                            <i class="bi bi-house-door-fill me-1"></i> Ana Sayfaya Dön
                        </a>
                        <button onclick="window.location.reload()" class="btn btn-outline-secondary px-4 py-2 rounded-pill fw-semibold">
                            <i class="bi bi-arrow-clockwise me-1"></i> Sayfayı Yenile
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
